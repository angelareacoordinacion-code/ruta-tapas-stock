<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5D5B">
<title>Ruta Tapas · Stock</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍢</text></svg>">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ruta Tapas">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">🍢</span>
    <span class="brand-name">Ruta&nbsp;Tapas</span>
    <button id="syncBtn" class="sync-btn" title="Sincronizar con la nube">🔄</button>
  </div>
  <div class="brand-sub" id="lastEventLabel">Sin eventos registrados aún</div>
</header>

<main id="app"></main>

<nav class="tabbar">
  <button class="tab-btn active" data-view="evento">
    <span class="tab-ic">📝</span><span>Nuevo evento</span>
  </button>
  <button class="tab-btn" data-view="compra">
    <span class="tab-ic">🧾</span><span>Compra</span>
  </button>
  <button class="tab-btn" data-view="especial">
    <span class="tab-ic">🛒</span><span>Especial</span>
  </button>
  <button class="tab-btn" data-view="stock">
    <span class="tab-ic">📦</span><span>Stock</span>
  </button>
  <button class="tab-btn" data-view="historial">
    <span class="tab-ic">🗂️</span><span>Historial</span>
  </button>
  <button class="tab-btn" data-view="resumen">
    <span class="tab-ic">📊</span><span>Resumen</span>
  </button>
</nav>

<div id="toast" class="toast"></div>
<a href="/admin.html" class="admin-link" title="Backoffice">⚙️</a>

<script type="module" src="app.js?v=6"></script>
</body>
</html>
